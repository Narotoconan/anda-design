<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="description" content="维护供应商、进货来源与联系信息。">
  <title>供应商管理 · 燧安进销存</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="../../css/suppliers.css?v=contact-matrix-1">
  <script src="../../js/admin-shell.js?v=20260920" defer></script>
  <script src="../../js/suppliers.js?v=contact-matrix-1" defer></script>
</head>
<body class="admin-shell suppliers-page">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <admin-sidebar active="suppliers"></admin-sidebar>
  <admin-topbar trail="基础资料|供应商管理"></admin-topbar>

  <svg class="supplier-symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="supplier-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="supplier-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="supplier-chevron" viewBox="0 0 24 24"><path d="m7 9 5 5 5-5"/></symbol>
    <symbol id="supplier-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="supplier-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/></symbol>
    <symbol id="supplier-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="supplier-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="supplier-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="supplier-store" viewBox="0 0 24 24"><path d="M4 10v10h16V10M3 10l2-6h14l2 6"/><path d="M3 10a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0M9 20v-6h6v6"/></symbol>
    <symbol id="supplier-factory" viewBox="0 0 24 24"><path d="M3 21V9l6 3V8l6 4V5h6v16Z"/><path d="M7 17h2m3 0h2m3 0h2"/></symbol>
    <symbol id="supplier-agent" viewBox="0 0 24 24"><path d="M4 20V8l8-4 8 4v12Z"/><path d="M8 12h8M8 16h5"/></symbol>
    <symbol id="supplier-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/></symbol>
  </svg>

  <main id="main-content" class="supplier-main" tabindex="-1">
    <div class="supplier-content">
      <header class="supplier-page-heading">
        <div class="supplier-heading-copy">
          <h1>供应商管理</h1>
          <p>维护供应商基础信息，方便进货时选择来源。</p>
        </div>
        <button class="supplier-primary-button" id="supplier-create" type="button" aria-haspopup="dialog" aria-controls="supplier-editor">
          <svg class="supplier-icon" aria-hidden="true"><use href="#supplier-plus"/></svg>
          新建供应商
        </button>
      </header>

      <section class="supplier-filter-bar" aria-label="供应商筛选">
        <div class="supplier-search" role="search">
          <svg class="supplier-icon" aria-hidden="true"><use href="#supplier-search"/></svg>
          <label class="visually-hidden" for="supplier-keyword">搜索供应商</label>
          <input id="supplier-keyword" type="search" placeholder="搜索名称、编码或联系方式" autocomplete="off">
        </div>
        <div class="supplier-select-wrap">
          <label class="visually-hidden" for="supplier-source-filter">按主要来源筛选</label>
          <select id="supplier-source-filter">
            <option value="all">全部来源</option>
            <option value="regional_agent">区域代理</option>
            <option value="manufacturer">厂家直供</option>
            <option value="online_store">线上店铺</option>
            <option value="other">其他</option>
          </select>
          <svg class="supplier-icon" aria-hidden="true"><use href="#supplier-chevron"/></svg>
        </div>
        <button class="supplier-clear-button" id="supplier-clear-filters" type="button" hidden>清空筛选</button>
      </section>

      <section class="supplier-workspace" aria-label="供应商列表">
        <div class="supplier-list-toolbar">
          <div class="supplier-status-filter" role="group" aria-label="供应商状态分类">
            <span class="supplier-filter-label">状态</span>
            <button class="supplier-filter-button is-active" type="button" data-status="all" aria-pressed="true">全部 <span id="supplier-all-count">8</span></button>
            <button class="supplier-filter-button" type="button" data-status="active" aria-pressed="false">启用 <span id="supplier-active-count">7</span></button>
            <button class="supplier-filter-button" type="button" data-status="inactive" aria-pressed="false">已停用 <span id="supplier-inactive-count">1</span></button>
          </div>
          <p class="supplier-count" aria-live="polite">共 <strong id="supplier-visible-count">8</strong> 家供应商</p>
        </div>

        <div class="supplier-table-wrap" id="supplier-results">
          <table class="supplier-table">
            <caption class="visually-hidden">供应商、采购优先级、进货来源与联系方式列表</caption>
            <colgroup>
              <col class="supplier-name-column">
              <col class="supplier-status-column">
              <col class="supplier-priority-column">
              <col class="supplier-source-column">
              <col class="supplier-contact-column">
              <col class="supplier-action-column">
            </colgroup>
            <thead>
              <tr>
                <th scope="col">供应商信息</th>
                <th scope="col">状态</th>
                <th scope="col">优先级</th>
                <th scope="col">主要来源</th>
                <th scope="col">联系人</th>
                <th scope="col">操作</th>
              </tr>
            </thead>
            <tbody id="supplier-table-body"></tbody>
          </table>
          <div class="supplier-empty-state" id="supplier-empty" hidden>
            <span class="supplier-empty-icon" aria-hidden="true"><svg class="supplier-icon"><use href="#supplier-store"/></svg></span>
            <strong id="supplier-empty-title">没有找到符合条件的供应商</strong>
            <p id="supplier-empty-copy">调整搜索内容或清空筛选后再试。</p>
            <button class="supplier-secondary-button" id="supplier-empty-action" type="button">清空筛选</button>
          </div>
        </div>

        <footer class="supplier-pagination" aria-label="供应商列表分页">
          <p id="supplier-page-summary">第 1–8 条，共 8 条</p>
          <nav class="supplier-page-controls" id="supplier-page-controls" aria-label="分页">
            <button class="supplier-page-button" type="button" aria-label="上一页" disabled><svg class="supplier-icon" aria-hidden="true"><use href="#supplier-left"/></svg></button>
            <button class="supplier-page-button is-current" type="button" aria-current="page">1</button>
            <button class="supplier-page-button" type="button" aria-label="下一页" disabled><svg class="supplier-icon" aria-hidden="true"><use href="#supplier-right"/></svg></button>
          </nav>
        </footer>
      </section>
    </div>
  </main>

  <dialog class="supplier-dialog" id="supplier-editor" aria-labelledby="supplier-editor-title">
    <form class="supplier-dialog-shell" id="supplier-form" novalidate>
      <header class="supplier-dialog-header">
        <h2 id="supplier-editor-title">新建供应商</h2>
        <button class="supplier-icon-button" type="button" data-close-editor aria-label="关闭供应商表单">
          <svg class="supplier-icon" aria-hidden="true"><use href="#supplier-close"/></svg>
        </button>
      </header>

      <div class="supplier-dialog-body">
        <div class="supplier-form-field supplier-field-wide" id="supplier-name-field">
          <label for="supplier-name-input">供应商名称 <span aria-hidden="true">*</span></label>
          <input id="supplier-name-input" name="supplier-name" maxlength="80" placeholder="输入公司、商行或店铺名称" autocomplete="organization" aria-describedby="supplier-name-error" required>
          <small class="supplier-field-error" id="supplier-name-error" role="alert" hidden></small>
        </div>

        <div class="supplier-form-field">
          <label for="supplier-code-input">供应商编码</label>
          <input id="supplier-code-input" value="保存后自动生成" readonly>
        </div>
        <div class="supplier-form-field" id="supplier-source-field">
          <label for="supplier-source-input">主要来源 <span aria-hidden="true">*</span></label>
          <div class="supplier-form-select">
            <select id="supplier-source-input" aria-describedby="supplier-source-error" required>
              <option value="">请选择主要来源</option>
              <option value="regional_agent">区域代理</option>
              <option value="manufacturer">厂家直供</option>
              <option value="online_store">线上店铺</option>
              <option value="other">其他</option>
            </select>
            <svg class="supplier-icon" aria-hidden="true"><use href="#supplier-chevron"/></svg>
          </div>
          <small class="supplier-field-error" id="supplier-source-error" role="alert" hidden></small>
        </div>

        <div class="supplier-form-field">
          <label for="supplier-priority-input">采购优先级</label>
          <div class="supplier-form-select">
            <select id="supplier-priority-input">
              <option value="preferred">优先</option>
              <option value="normal" selected>普通</option>
              <option value="backup">备选</option>
            </select>
            <svg class="supplier-icon" aria-hidden="true"><use href="#supplier-chevron"/></svg>
          </div>
        </div>

        <div class="supplier-form-field">
          <label for="supplier-region-input">所在地区</label>
          <input id="supplier-region-input" maxlength="60" placeholder="例如：江苏·南京" autocomplete="address-level1">
        </div>

        <div class="supplier-form-field supplier-field-wide supplier-contacts-field">
          <div class="supplier-contact-editor-head">
            <span>联系人</span>
            <button class="supplier-add-contact" id="supplier-add-contact" type="button">
              <svg class="supplier-icon" aria-hidden="true"><use href="#supplier-plus"/></svg>
              添加联系人
            </button>
          </div>
          <div class="supplier-contact-column-labels" aria-hidden="true"><span>姓名</span><span>联系方式</span></div>
          <div class="supplier-contact-editor" id="supplier-contact-editor"></div>
        </div>

        <div class="supplier-online-fields supplier-field-wide" id="supplier-online-fields" hidden>
          <div class="supplier-form-field">
            <label for="supplier-platform-input">采购平台</label>
            <input id="supplier-platform-input" maxlength="30" placeholder="例如：1688、淘宝">
          </div>
          <div class="supplier-form-field" id="supplier-url-field">
            <label for="supplier-url-input">店铺链接</label>
            <input id="supplier-url-input" type="url" placeholder="https://" aria-describedby="supplier-url-error" inputmode="url">
            <small class="supplier-field-error" id="supplier-url-error" role="alert" hidden></small>
          </div>
        </div>

        <div class="supplier-form-field supplier-field-wide">
          <label for="supplier-remark-input">备注</label>
          <textarea id="supplier-remark-input" maxlength="200" rows="3" placeholder="补充联系说明或供货信息"></textarea>
          <small class="supplier-character-count"><span id="supplier-remark-count">0</span> / 200</small>
        </div>

        <label class="supplier-status-setting supplier-field-wide">
          <span><strong>启用供应商</strong><small>启用后可在进货时选择。</small></span>
          <span class="supplier-switch"><input id="supplier-enabled-input" type="checkbox" checked><span aria-hidden="true"></span></span>
        </label>
      </div>

      <footer class="supplier-dialog-footer">
        <button class="supplier-secondary-button" type="button" data-close-editor>取消</button>
        <button class="supplier-save-button" id="supplier-save" type="submit">保存供应商</button>
      </footer>
    </form>
  </dialog>

  <div class="supplier-toast" id="supplier-toast" role="status" hidden>
    <svg class="supplier-icon" aria-hidden="true"><use href="#supplier-check"/></svg>
    <span></span>
  </div>
</body>
</html>
